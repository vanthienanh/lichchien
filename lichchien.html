<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Chiếu Phim - Cửu Trùng Thiên</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* --- KHAI BÁO BIẾN MÀU SẮC (Dễ dàng thay đổi giao diện tại đây) --- */
        :root {
            --bg-color: #0d0d0d;        /* Màu nền chủ đạo */
            --header-bg: #161616;      /* Màu nền thanh đầu trang */
            --text-color: #f1f1f1;     /* Màu chữ chính */
            --primary-color: #ff5722;   /* Màu cam thương hiệu (Nút bấm, tiêu đề) */
            --early-color: #00e676;     /* Màu xanh cho phim Chiếu Sớm */
            --card-bg: #1e1e1e;        /* Màu nền khung phim */
            --border-color: #2a2a2a;   /* Màu đường viền */
        }

        /* --- THIẾT LẬP CƠ BẢN --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.5; }

        /* --- 1. THANH HEADER (Logo, Tìm kiếm, Đăng nhập) --- */
        header {
            background-color: var(--header-bg);
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 1001; /* Giữ header luôn ở trên cùng khi cuộn */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .logo { font-size: 20px; font-weight: 800; color: var(--primary-color); text-decoration: none; text-transform: uppercase; }

        /* Khung tìm kiếm */
        .search-container { flex-grow: 1; display: flex; justify-content: center; padding: 0 20px; }
        .search-box {
            background: #252525; border-radius: 6px; padding: 6px 15px;
            display: flex; align-items: center; width: 100%; max-width: 400px; border: 1px solid #333;
        }
        .search-box input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 14px; }

        .login-btn { background: var(--primary-color); border: none; color: white; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* --- 2. THANH MENU ĐIỀU HƯỚNG --- */
        .main-nav { background: #111; border-bottom: 1px solid var(--border-color); display: flex; padding: 0 5%; }
        .nav-list { list-style: none; display: flex; }
        .nav-item { position: relative; }
        .nav-link { display: block; padding: 12px 20px; color: #ccc; text-decoration: none; font-size: 14px; font-weight: 600; }
        .nav-link:hover, .nav-item.active .nav-link { background: rgba(255,255,255,0.05); color: #fff; }

        /* Menu con (Submenu) cho Thể Loại */
        .submenu {
            position: absolute; top: 100%; left: 0;
            background: var(--header-bg);
            display: none; /* Mặc định ẩn */
            grid-template-columns: 1fr 1fr; /* Chia làm 2 cột */
            width: 300px;
            border: 1px solid var(--border-color);
            z-index: 1000;
            padding: 10px;
        }
        .nav-item:hover .submenu { display: grid; } /* Hiện khi rê chuột vào nav-item */
        .submenu a { padding: 8px; color: #bbb; text-decoration: none; font-size: 13px; }
        .submenu a:hover { color: var(--primary-color); background: rgba(255,255,255,0.05); }

        /* --- 3. THANH CUỘN CHỌN THỨ (Tabs) --- */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }

        .tabs { 
            display: flex; 
            overflow-x: auto; /* Cho phép cuộn ngang */
            gap: 10px; 
            margin-bottom: 25px; 
            padding-bottom: 12px;
            background: transparent;
            cursor: grab; /* Biểu tượng bàn tay khi di chuột vào trên PC */
            user-select: none;
            -webkit-overflow-scrolling: touch; /* Giúp cuộn cực mượt trên iPhone/Android */
        }

        /* Ẩn/Chỉnh sửa thanh cuộn (Scrollbar) cho đẹp */
        .tabs::-webkit-scrollbar { height: 4px; }
        .tabs::-webkit-scrollbar-track { background: transparent; }
        .tabs::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        .tabs:active { cursor: grabbing; } /* Biểu tượng nắm tay khi đang kéo */

        .tab-btn {
            background: transparent; color: #888; border: 1px solid #333; 
            padding: 10px 25px; cursor: pointer; border-radius: 4px; 
            font-weight: 700; white-space: nowrap; transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        /* --- 4. BỐ CỤC DANH SÁCH PHIM (Grid) --- */
        .section-title { font-size: 1.1rem; margin: 30px 0 15px; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ""; width: 4px; height: 18px; background: var(--primary-color); border-radius: 2px; }
        
        /* Chia cột phim tự động dựa theo kích thước màn hình */
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        .movie-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; text-decoration: none; color: inherit; transition: 0.3s; border: 1px solid #222; }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--primary-color); }
        
        /* Poster phim giữ tỷ lệ chuẩn */
        .poster-box { position: relative; padding-top: 140%; } 
        .poster-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .movie-info { padding: 10px; text-align: center; }
        .movie-name { font-size: 13px; font-weight: 600; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        /* --- THIẾT BỊ DI ĐỘNG (Dưới 600px) --- */
        @media (max-width: 600px) {
            header { padding: 10px; flex-wrap: wrap; }
            .search-container { order: 3; width: 100%; padding-top: 10px; } /* Đẩy thanh tìm kiếm xuống dòng dưới logo */
            .submenu { width: 220px; }
        }
    </style>
</head>

        const slider = document.getElementById('dayTabs');
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => { isDown = false; });
        slider.addEventListener('mouseup', () => { isDown = false; });
        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; // Tốc độ kéo
            slider.scrollLeft = scrollLeft - walk;
        });

        /* --- HÀM TÌM KIẾM PHIM --- */
        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const display = document.getElementById('contentDisplay');
            
            // Nếu ô tìm kiếm trống, hiển thị lại lịch ngày hôm nay
            if (keyword === "") {
                const today = new Date().getDay();
                const daysMap = ['chunhat', 'thu2', 'thu3', 'thu4', 'thu5', 'thu6', 'thu7'];
                loadDay(daysMap[today], document.querySelector(`[data-day="${daysMap[today]}"]`));
                return;
            }

            // Xóa trạng thái "Active" của các nút Thứ khi đang tìm phim
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            let results = [];
            // Lặp qua toàn bộ database để tìm phim khớp từ khóa
            Object.values(database).forEach(day => {
                const all = [...(day.early || []), ...(day.normal || [])];
                all.forEach(m => { 
                    if (m.t.toLowerCase().includes(keyword) && !results.some(r => r.t === m.t)) {
                        results.push(m); 
                    }
                });
            });

            // Hiển thị kết quả tìm được
            display.innerHTML = results.length > 0 
                ? `<h3 class="section-title">🔍 KẾT QUẢ TÌM KIẾM</h3>${buildGrid(results)}` 
                : "<p style='text-align:center; padding:50px; opacity:0.5;'>Không tìm thấy phim này.</p>";
        }

        /* --- HÀM TẠO CẤU TRÚC HTML CHO MỖI PHIM --- */
        function buildGrid(list) {
            return `<div class="movie-grid">${list.map(item => `
                <a href="${item.l}" class="movie-card">
                    <div class="poster-box"><img src="${item.i}" class="poster-img"></div>
                    <div class="movie-info"><div class="movie-name">${item.t}</div></div>
                </a>`).join('')}</div>`;
        }

        /* --- HÀM TẢI LỊCH CHIẾU THEO THỨ --- */
        function loadDay(dayKey, btn) {
            // Khi nhấn chọn Thứ, xóa ô tìm kiếm
            document.getElementById('searchInput').value = "";
            
            // Cập nhật hiệu ứng nút Active
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            const display = document.getElementById('contentDisplay');
            const data = database[dayKey] || { early: [], normal: [] };
            
            let html = "";
            // Kiểm tra và hiển thị mục Chiếu sớm
            if (data.early?.length > 0) html += `<h3 class="section-title" style="color:var(--early-color)">🔥 CHIẾU SỚM</h3>${buildGrid(data.early)}`;
            // Kiểm tra và hiển thị mục Lịch chính thức
            if (data.normal?.length > 0) html += `<h3 class="section-title" style="color:var(--primary-color)">📺 LỊCH CHÍNH THỨC</h3>${buildGrid(data.normal)}`;
            
            display.innerHTML = html || "<p style='text-align:center; padding:50px; opacity:0.5;'>Chưa có lịch chiếu cho ngày này.</p>";
        }

        /* --- TỰ ĐỘNG CHẠY KHI TRANG WEB TẢI XONG --- */
        window.onload = () => {
            const today = new Date().getDay(); // Lấy ngày hiện tại (0=CN, 1=T2...)
            const daysMap = ['chunhat', 'thu2', 'thu3', 'thu4', 'thu5', 'thu6', 'thu7'];
            // Tự động nhấn vào nút Thứ tương ứng với ngày thực tế
            loadDay(daysMap[today], document.querySelector(`[data-day="${daysMap[today]}"]`));
        };
    </script>
